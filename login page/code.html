<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <meta content="web_blank" name="shell-type">
  <title>ClassNote AI — Faculty & Student Sign In</title>

  <!-- Immediate early inline theme resolver to eliminate flash of unstyled content (FOUC) -->
  <script> 
    (function() {
      try {
        const stored = localStorage.getItem('classnote_global_theme') || localStorage.getItem('classnote_theme');
        if (stored === 'light') {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        } else if (stored === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (prefersDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        }
      } catch(e) {}
    })();
  </script>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              300: '#a5b4fc',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            },
            midnight: {
              800: '#141c2e',
              850: '#0f1524',
              900: '#090d16',
              950: '#060910'
            }
          },
          fontFamily: {
            sans: ["Plus Jakarta Sans", "Inter", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>

  <!-- Shared Design System -->
  <link rel="stylesheet" href="../stitch_classnote_ai_platform/shared-theme/theme.css">

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-14px) scale(1.03); }
    }
    @keyframes cardFadeIn {
      0% { opacity: 0; transform: translateY(16px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .animate-float-slow { animation: floatSlow 14s ease-in-out infinite; }
    .animate-float-reverse { animation: floatSlow 18s ease-in-out infinite reverse; }
    .animate-card-in { animation: cardFadeIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>

<body class="min-h-screen bg-[#f8fafc] dark:bg-[#090d16] text-slate-800 dark:text-slate-100 flex flex-col justify-between selection:bg-indigo-500/25 selection:text-indigo-600 dark:selection:text-indigo-300 font-sans transition-colors duration-300 relative overflow-x-hidden">
  
  <!-- Ambient Animated Background Glows -->
  <div aria-hidden="true" class="pointer-events-none fixed inset-0 z-0 overflow-hidden">
    <div class="animate-float-slow absolute -top-32 left-1/2 -translate-x-1/2 w-[680px] h-[520px] rounded-full bg-gradient-to-br from-indigo-400/25 via-violet-400/20 to-sky-300/15 dark:from-indigo-600/20 dark:via-purple-600/15 dark:to-cyan-600/10 blur-[130px] transition-colors duration-500"></div>
    <div class="animate-float-reverse absolute -bottom-32 right-1/4 w-[500px] h-[500px] rounded-full bg-blue-300/20 dark:bg-sky-500/10 blur-[130px] transition-colors duration-500"></div>
    <!-- Technical Grid Overlay -->
    <div class="absolute inset-0 opacity-[0.45] dark:opacity-[0.12] bg-[linear-gradient(to_right,#cbd5e1_1px,transparent_1px),linear-gradient(to_bottom,#cbd5e1_1px,transparent_1px)] dark:bg-[linear-gradient(to_right,#334155_1px,transparent_1px),linear-gradient(to_bottom,#334155_1px,transparent_1px)] bg-[size:3.5rem_3.5rem] [mask-image:radial-gradient(ellipse_70%_60%_at_50%_50%,black_30%,transparent_85%)]"></div>
  </div>

  <!-- Header -->
  <header class="relative z-20 w-full max-w-7xl mx-auto px-4 sm:px-8 py-5 flex items-center justify-between">
    <a class="flex items-center gap-3 group focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 rounded-xl p-1" href="#">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25 transition-transform duration-200 group-hover:scale-105">
        <span class="material-symbols-outlined text-[22px]">auto_awesome</span>
      </div>
      <div class="flex flex-col">
        <span class="text-[19px] font-bold tracking-tight text-slate-900 dark:text-white transition-colors duration-300 leading-tight">
          ClassNote <span class="bg-gradient-to-r from-indigo-500 via-violet-500 to-cyan-400 bg-clip-text text-transparent">AI</span>
        </span>
        <span class="text-[10px] font-mono tracking-wider uppercase text-slate-500 dark:text-slate-400 font-medium">Educational SaaS</span>
      </div>
    </a>

    <!-- Theme Switcher Button -->
    <button aria-label="Toggle light and dark mode" class="group flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-white dark:bg-[#131a2b] text-slate-700 dark:text-slate-200 hover:text-indigo-600 dark:hover:text-white border border-slate-200/90 dark:border-slate-800 shadow-sm backdrop-blur-md transition-all duration-200 hover:scale-105 active:scale-95 focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500 cursor-pointer" id="theme-toggle" type="button">
      <span class="material-symbols-outlined text-[19px] transition-transform duration-300 group-hover:rotate-45" id="theme-icon">light_mode</span>
      <span class="text-xs font-semibold tracking-wide capitalize select-none hidden sm:inline" id="theme-label">Light Mode</span>
    </button>
  </header>

  <!-- Main Login Card -->
  <main class="relative z-10 w-full flex-1 flex items-center justify-center py-8 sm:py-12 px-4">
    <div class="animate-card-in w-full max-w-[440px] sm:max-w-[460px]">
      <div class="relative rounded-2xl sm:rounded-3xl bg-white dark:bg-[#131a2b]/95 backdrop-blur-xl border border-slate-200 dark:border-slate-800 shadow-xl shadow-slate-200/60 dark:shadow-[0_24px_64px_-16px_rgba(0,0,0,0.65)] p-6 sm:p-9 transition-all duration-300">
        
        <!-- Top Accent Gradient Line -->
        <div class="absolute inset-x-0 top-0 h-[2px] bg-gradient-to-r from-transparent via-indigo-500 dark:via-indigo-400 to-transparent rounded-t-3xl"></div>

        <!-- Header Icon & Welcome -->
        <div class="flex flex-col items-center text-center mb-6 sm:mb-7">
          <div class="w-12 h-12 rounded-2xl bg-indigo-50 dark:bg-indigo-500/10 border border-indigo-200/70 dark:border-indigo-400/20 flex items-center justify-center text-indigo-600 dark:text-indigo-400 mb-3.5 shadow-sm transition-colors duration-300">
            <span class="material-symbols-outlined text-[24px]">school</span>
          </div>
          <h1 class="text-2xl sm:text-[26px] font-bold tracking-tight text-slate-900 dark:text-white transition-colors duration-300">Teacher Workspace</h1>
          <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-400 mt-1.5 transition-colors duration-300">Sign in to your authenticated faculty portal</p>
        </div>

        <!-- Form -->
        <form class="space-y-4" id="login-form" onsubmit="event.preventDefault(); handleSignIn();">
          <!-- Email field -->
          <div class="space-y-1.5 text-left">
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 tracking-wide transition-colors duration-300" for="email">Faculty Email Address</label>
            <div class="relative">
              <input class="w-full min-h-[44px] px-3.5 sm:px-4 py-2.5 rounded-xl bg-slate-50 dark:bg-[#0b101c] text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 border border-slate-200 dark:border-slate-800 text-sm focus:outline-none focus:border-indigo-500 dark:focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/15 transition-all duration-200" id="email" placeholder="faculty@university.edu" required="" type="email" autocomplete="email">
            </div>
          </div>

          <!-- Password field -->
          <div class="space-y-1.5 text-left">
            <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 tracking-wide transition-colors duration-300" for="password">Password</label>
            <div class="relative">
              <input class="w-full min-h-[44px] pl-3.5 sm:pl-4 pr-11 py-2.5 rounded-xl bg-slate-50 dark:bg-[#0b101c] text-slate-900 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 border border-slate-200 dark:border-slate-800 text-sm focus:outline-none focus:border-indigo-500 dark:focus:border-indigo-400 focus:ring-4 focus:ring-indigo-500/15 transition-all duration-200" id="password" placeholder="••••••••••••" required="" type="password" autocomplete="current-password">
              <button aria-label="Toggle password visibility" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 p-1.5 rounded-lg transition-colors cursor-pointer" id="toggle-password" type="button">
                <span class="material-symbols-outlined text-[19px] align-middle" id="eye-icon">visibility</span>
              </button>
            </div>
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="flex items-center justify-between pt-0.5 text-xs sm:text-sm flex-wrap gap-2">
            <label class="flex items-center gap-2 cursor-pointer select-none text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 transition-colors">
              <input checked="" class="w-4 h-4 rounded border-slate-300 dark:border-slate-700 text-indigo-600 focus:ring-indigo-500/20 dark:bg-slate-800 cursor-pointer" id="remember" type="checkbox">
              <span>Remember this session</span>
            </label>
            <a class="font-medium text-indigo-600 dark:text-indigo-400 hover:text-indigo-500 dark:hover:text-indigo-300 transition-colors" href="#" id="forgot-password">Forgot password?</a>
          </div>

          <!-- Submit Button -->
          <div class="pt-2">
            <button class="relative group w-full min-h-[46px] py-2.5 px-4 rounded-xl bg-gradient-to-r from-indigo-600 via-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold text-sm shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-200 flex items-center justify-center gap-2 overflow-hidden cursor-pointer" id="submit-btn" type="submit">
              <span class="flex items-center gap-1.5" id="btn-label">
                <span>Sign In to Workspace</span>
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
              </span>
              <span class="hidden items-center gap-2" id="btn-loader">
                <span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
                <span>Authenticating...</span>
              </span>
            </button>
          </div>
        </form>

        <!-- Dynamic Auth Alert Message -->
        <div id="auth-message" class="hidden mt-4 rounded-xl px-3.5 py-3 text-sm transition-all" role="status" aria-live="polite"></div>

        <!-- Security Footnote -->
        <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-center gap-2 text-xs text-slate-400 dark:text-slate-500 text-center transition-colors duration-300">
          <span class="material-symbols-outlined text-[16px] text-emerald-500 shrink-0">verified_user</span>
          <span>Row-Level Secured • University Faculty Portal</span>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="relative z-20 w-full max-w-7xl mx-auto px-4 py-5 text-center text-xs text-slate-500 dark:text-slate-400 transition-colors duration-300">
    <div class="flex items-center justify-center gap-2 sm:gap-4 flex-wrap">
      <span>© 2026 ClassNote AI Platform</span>
      <span>·</span>
      <span class="text-slate-400 dark:text-slate-500">Autonomous Academic Documentation</span>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../stitch_classnote_ai_platform/shared-theme/theme.js"></script>

  <script>
    const SUPABASE_URL = 'https://wzdwnyxepryutqstsiso.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_tjdSpu-3rMRBLLG5e4YIqw_QVRynkgA';

    const authMessage = document.getElementById('auth-message');
    const loginForm = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const btnLabel = document.getElementById('btn-label');
    const btnLoader = document.getElementById('btn-loader');

    function getSupabaseClient() {
      if (!window.supabase?.createClient) {
        throw new Error('Authentication library could not load. Check your internet connection.');
      }
      return window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
    }

    let authMessageTimer;

    function showAuthMessage(message, type = 'error') {
      if (!authMessage) return;
      if (authMessageTimer) clearTimeout(authMessageTimer);

      authMessage.textContent = message;
      authMessage.classList.remove('hidden', 'bg-red-500/10', 'text-red-600', 'dark:text-red-400', 'border', 'border-red-500/20',
                                   'bg-emerald-500/10', 'text-emerald-600', 'dark:text-emerald-400', 'border-emerald-500/20',
                                   'bg-amber-500/10', 'text-amber-600', 'dark:text-amber-400', 'border-amber-500/20');

      if (type === 'success') {
        authMessage.classList.add('bg-emerald-500/10', 'text-emerald-600', 'dark:text-emerald-400', 'border', 'border-emerald-500/20');
      } else if (type === 'warning') {
        authMessage.classList.add('bg-amber-500/10', 'text-amber-600', 'dark:text-amber-400', 'border', 'border-amber-500/20');
      } else {
        authMessage.classList.add('bg-red-500/10', 'text-red-600', 'dark:text-red-400', 'border', 'border-red-500/20');
      }

      authMessageTimer = setTimeout(() => {
        authMessage.classList.add('hidden');
        authMessage.textContent = '';
      }, 5000);
    }

    function getFriendlyAuthError(error) {
      const message = (error?.message || '').toLowerCase();
      if (message.includes('invalid login credentials') ||
          message.includes('invalid email or password') ||
          message.includes('invalid credentials')) {
        return 'Email or password is incorrect. Please check your credentials and try again.';
      }
      if (message.includes('email not confirmed')) {
        return 'Please verify your email address before signing in.';
      }
      if (message.includes('too many requests')) {
        return 'Too many attempts. Please wait a moment and try again.';
      }
      if (message.includes('network') || message.includes('fetch')) {
        return 'Network connection error. Check your internet connection and try again.';
      }
      return error?.message || 'We couldn’t sign you in. Please check your details and try again.';
    }

    function setLoading(isLoading, label = 'Signing in...') {
      if (!submitBtn) return;
      submitBtn.disabled = isLoading;
      if (btnLabel) btnLabel.classList.toggle('hidden', isLoading);
      if (btnLoader) {
        btnLoader.classList.toggle('hidden', !isLoading);
        btnLoader.classList.toggle('flex', isLoading);
        const loaderText = btnLoader.querySelector('span:last-child');
        if (loaderText) loaderText.textContent = label;
      }
    }

    function getDashboardUrl() {
      return new URL('../stitch_classnote_ai_platform/teacher_dashboard_classnote_ai/code.html', window.location.href).href;
    }

    // Toggle password visibility
    const pwdInput = document.getElementById('password');
    const togglePwdBtn = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');
    if (togglePwdBtn && pwdInput && eyeIcon) {
      togglePwdBtn.addEventListener('click', () => {
        const isPassword = pwdInput.type === 'password';
        pwdInput.type = isPassword ? 'text' : 'password';
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    async function handleSignIn() {
      if (!loginForm?.reportValidity()) return;

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      setLoading(true, 'Verifying credentials...');
      if (authMessage) authMessage.classList.add('hidden');

      try {
        const client = getSupabaseClient();
        const { data, error } = await client.auth.signInWithPassword({ email, password });
        if (error) throw error;
        if (!data.session || !data.user) throw new Error('Login succeeded but session could not be established.');

        // Pre-fetch and cache the teacher profile before redirecting
        try {
          if (window.ClassNoteAuth?.fetchProfile) {
            const profile = await window.ClassNoteAuth.fetchProfile(client, data.user);
            sessionStorage.setItem('classnote_teacher_profile', JSON.stringify(profile));
          }
        } catch (_) {}

        setLoading(true, 'Entering workspace...');
        window.location.assign(getDashboardUrl());
      } catch (error) {
        showAuthMessage(getFriendlyAuthError(error));
        setLoading(false);
      }
    }
    window.handleSignIn = handleSignIn;

    // Forgot password handler
    document.getElementById('forgot-password')?.addEventListener('click', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      if (!email) {
        showAuthMessage('Enter your faculty email address first, then click Forgot password?');
        document.getElementById('email')?.focus();
        return;
      }
      try {
        const client = getSupabaseClient();
        const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
        if (error) throw error;
        showAuthMessage('If an account exists for this email, a password reset link has been sent.', 'success');
      } catch (error) {
        showAuthMessage(error.message || 'Could not send the password reset email.');
      }
    });

    // Check if user is already authenticated
    (async function checkExistingSession() {
      try {
        const client = getSupabaseClient();
        const { data: { session }, error } = await client.auth.getSession();
        if (!error && session?.user) {
          window.location.replace(getDashboardUrl());
        }
      } catch (e) {
        // Not fatal, user can simply login
      }
    })();
  </script>
</body>
</html>
